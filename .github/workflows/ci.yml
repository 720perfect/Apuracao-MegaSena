name: Python CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependencias e ferramentas
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Validar sintaxe com Flake8
      run: |
        # Para a execucao se houver erros de sintaxe ou variaveis nao definidas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Executar script gerador (Validacao basica)
      run: |
        python gerador.py 10
